services:
  api:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - logs:/app/logs
    restart: unless-stopped
    # Security: read-only filesystem, only logs dir is writable
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Drop all Linux capabilities — add back only what's needed
    cap_drop:
      - ALL

volumes:
  logs:
